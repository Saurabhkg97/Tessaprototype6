<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriStack PoS - Digital Agriculture Mission</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background-color: #f3f4f6; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); } }
        @keyframes scan-line { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
        .animate-scan { animation: scan-line 2s linear infinite; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON SYSTEM ---
        const IconWrapper = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        // --- ICONS ---
        const Store = (p) => <IconWrapper {...p}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></IconWrapper>;
        const ShoppingCart = (p) => <IconWrapper {...p}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></IconWrapper>;
        const TrendingUp = (p) => <IconWrapper {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconWrapper>;
        const User = (p) => <IconWrapper {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
        const History = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/><path d="M12 7v5l3 3"/></IconWrapper>;
        const Globe = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconWrapper>;
        const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
        const Phone = (p) => <IconWrapper {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.12 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;
        const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
        const ChevronRight = (p) => <IconWrapper {...p}><path d="m9 18 6-6-6-6"/></IconWrapper>;
        const ArrowRight = (p) => <IconWrapper {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconWrapper>;
        const ArrowLeft = (p) => <IconWrapper {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
        const LogOut = (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconWrapper>;
        const ShieldCheck = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
        const Scan = (p) => <IconWrapper {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></IconWrapper>;
        const Fingerprint = (p) => <IconWrapper {...p}><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 6"/><path d="M5 15.1A2 2 0 0 1 9.5 13a2.5 2.5 0 0 1 5 0 2 2 0 0 1 4.5 2.1"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 0"/><path d="M9 19.5v-3.2a2 2 0 0 1 1.2-1.9 2 2 0 0 1 2.8 0 2 2 0 0 1 1.2 1.9v3.2a2 2 0 0 1-2 2h-1.2a2 2 0 0 1-2-2z"/></IconWrapper>;
        const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
        const Bell = (p) => <IconWrapper {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></IconWrapper>;
        const Share2 = (p) => <IconWrapper {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></IconWrapper>;
        const CheckCircle = (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const AlertCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;
        const MessageSquare = (p) => <IconWrapper {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconWrapper>;
        const Keypad = (p) => <IconWrapper {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconWrapper>;
        const QrCode = (p) => <IconWrapper {...p}><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></IconWrapper>;
        const CreditCard = (p) => <IconWrapper {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></IconWrapper>;
        const Download = (p) => <IconWrapper {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>;
        const Smartphone = (p) => <IconWrapper {...p}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></IconWrapper>;
        const Landmark = (p) => <IconWrapper {...p}><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></IconWrapper>;
        const Leaf = (p) => <IconWrapper {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.77 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></IconWrapper>;

        // --- MOCK DATA ---

        const MARKET_DATA = [
            { id: 1, name: "Wheat (Sharbati)", price: 2125, unit: "Qtl", trend: "up", maxYieldPerAcre: 18 },
            { id: 2, name: "Rice (Basmati)", price: 3850, unit: "Qtl", trend: "stable", maxYieldPerAcre: 22 },
            { id: 3, name: "Cotton (Long)", price: 6200, unit: "Qtl", trend: "down", maxYieldPerAcre: 10 },
            { id: 4, name: "Soybean", price: 4800, unit: "Qtl", trend: "up", maxYieldPerAcre: 8 },
            { id: 5, name: "Mustard", price: 5450, unit: "Qtl", trend: "up", maxYieldPerAcre: 12 },
        ];

        const INPUT_INVENTORY = [
            { id: 101, name: "Urea (Neem Coated)", price: 266, unit: "Bag (45kg)", type: "fertilizer", isDBT: true, recommendedSoil: ["Alluvial", "Clay", "Loam"] },
            { id: 102, name: "DAP Fertilizer", price: 1350, unit: "Bag (50kg)", type: "fertilizer", isDBT: true, recommendedSoil: ["Alluvial", "Clay", "Loam"] },
            // Maize: Set to Black/Red to trigger warning for Alluvial user
            { id: 103, name: "Hybrid Maize Seeds", price: 450, unit: "Packet (1kg)", type: "seed", isDBT: false, recommendedSoil: ["Black", "Red"] }, 
            { id: 104, name: "Pesticide (Generic)", price: 800, unit: "Litre", type: "chemical", isDBT: false },
        ];

        const GOV_SCHEMES_LIST = [
            { id: 1, title: "PM-KISAN", desc: "Income support of ₹6,000 per year in 3 installments.", status: "Eligible" },
            { id: 2, title: "Kisan Credit Card (KCC)", desc: "Short term credit for crops at low interest rates.", status: "Apply Now" },
            { id: 3, title: "Pradhan Mantri Fasal Bima Yojana", desc: "Crop insurance against non-preventable natural risks.", status: "Apply Now" },
            { id: 4, title: "Soil Health Card", desc: "Crop-wise recommendations of nutrients.", status: "Applied" },
        ];

        const FARMER_DB = [
            { 
                id: "AGRI-MP-123456", name: "Rajesh Kumar", district: "Vidisha", state: "Madhya Pradesh", 
                creditScore: 720, phone: "+91 98765 43210", panchayat: "Khamkheda",
                kccLimit: 50000, kccUsed: 12000, shcStatus: "Active",
                ulpin: "MP-1104-5502-0012", landArea: 2.5, soilType: "Alluvial",
                history: [
                    { id: 101, type: 'buy', items: [{ name: "Urea", qty: 2 }], total: 532, date: "2023-11-15T10:30:00" },
                    { id: 102, type: 'sell', items: [{ name: "Wheat", qty: 10 }], total: 21250, date: "2023-10-20T14:15:00" }
                ]
            },
            { 
                id: "AGRI-MP-123457", name: "Suresh Singh", district: "Sehore", state: "Madhya Pradesh", 
                creditScore: 680, phone: "+91 98765 11223", panchayat: "Khamkheda",
                kccLimit: 120000, kccUsed: 118000, shcStatus: "Expired",
                ulpin: "MP-1104-5502-8877", landArea: 5.0, soilType: "Black",
                history: [
                    { id: 201, type: 'buy', items: [{ name: "DAP Fertilizer", qty: 5 }], total: 6750, date: "2023-11-10T09:00:00" }
                ]
            }
        ];

        // --- HELPER COMPONENT: NOTIFICATION TOAST ---
        const Notification = ({ message, type, onClose }) => (
            <div className={`fixed top-4 left-4 right-4 p-4 rounded-xl shadow-lg z-[100] flex items-center gap-3 animate-slide-up ${type === 'error' ? 'bg-red-50 border border-red-200 text-red-800' : 'bg-green-50 border border-green-200 text-green-800'}`}>
                {type === 'error' ? <AlertCircle size={20} /> : <CheckCircle size={20} />}
                <p className="text-sm font-bold flex-1">{message}</p>
                <button onClick={onClose} className="text-gray-400 font-bold">X</button>
            </div>
        );

        // --- Helper Components ---

        const Avatar = ({ name, size = "md", className = "" }) => {
            const initials = name ? name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : "U";
            const colors = ['bg-blue-100 text-blue-700', 'bg-green-100 text-green-700', 'bg-purple-100 text-purple-700', 'bg-amber-100 text-amber-700'];
            const colorClass = colors[name.length % colors.length];
            const sizeClasses = size === "xl" ? "w-24 h-24 text-3xl" : size === "lg" ? "w-16 h-16 text-xl" : size === "sm" ? "w-10 h-10 text-xs" : "w-14 h-14 text-lg";
            return <div className={`${sizeClasses} ${colorClass} rounded-full flex items-center justify-center font-bold border-2 border-white shadow-sm shrink-0 ${className}`}>{initials}</div>;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-5 ${className}`}>{children}</div>
        );

        const Header = ({ officerMode, onLogout }) => (
            <div className={`p-4 sticky top-0 z-50 flex items-center justify-between border-b border-gray-100 ${officerMode ? 'bg-[#003366] text-white' : 'bg-white'}`}>
                <div className="flex items-center gap-3">
                    <div className="flex flex-col items-center justify-center w-8">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem" className={`w-6 h-auto ${officerMode ? 'brightness-0 invert' : 'opacity-80'}`} onError={(e) => e.target.style.display = 'none'} />
                    </div>
                    <div>
                        <h1 className={`font-bold text-lg leading-none tracking-tight ${officerMode ? 'text-white' : 'text-[#003366]'}`}>
                            {officerMode ? 'Officer Assist Mode' : 'Point of Sale App'}
                        </h1>
                        <p className={`text-[10px] font-medium ${officerMode ? 'text-blue-200' : 'text-gray-500'}`}>Government of India</p>
                    </div>
                </div>
                <div className="flex items-center gap-3">
                    <button className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium active:bg-gray-200 transition-colors ${officerMode ? 'bg-blue-800 text-white border border-blue-700' : 'bg-gray-100 text-gray-700'}`}>
                        <Globe size={14} /> EN/हिंदी
                    </button>
                    {onLogout && <button onClick={onLogout} className="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600"><LogOut size={16} /></button>}
                </div>
            </div>
        );

        const Navigation = ({ activeTab, setActiveTab }) => {
            const tabs = [
                { id: 'dashboard', icon: Store, label: 'Home' },
                { id: 'pos', icon: ShoppingCart, label: 'Transact' },
                { id: 'market', icon: TrendingUp, label: 'Mandi' },
                { id: 'profile', icon: User, label: 'Profile' },
            ];
            return (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe z-50 max-w-md mx-auto">
                    <div className="flex justify-around items-center h-16">
                        {tabs.map((tab) => {
                            const IconComp = tab.icon;
                            return (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center w-full h-full transition-colors duration-200 ${activeTab === tab.id ? 'text-[#003366] font-semibold' : 'text-gray-400 hover:text-gray-600'}`}>
                                    <div className={`mb-1 transition-transform ${activeTab === tab.id ? 'scale-110' : ''}`}><IconComp size={24} strokeWidth={activeTab === tab.id ? 2.5 : 2} /></div>
                                    <span className="text-[10px] uppercase tracking-wide">{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- MODALS ---

        const QRScannerModal = ({ onClose, onScan }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    const randomItem = INPUT_INVENTORY[Math.floor(Math.random() * INPUT_INVENTORY.length)];
                    onScan(randomItem);
                }, 2500);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="fixed inset-0 z-[70] bg-black flex flex-col items-center justify-center animate-fade-in">
                    <button onClick={onClose} className="absolute top-4 right-4 text-white bg-white/10 p-2 rounded-full"><LogOut size={24} className="rotate-180" /></button>
                    <div className="relative w-64 h-64 border-2 border-green-400 rounded-lg overflow-hidden mb-8">
                        <div className="absolute inset-0 bg-white/10"></div>
                        <div className="absolute w-full h-1 bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.8)] animate-scan"></div>
                        <div className="absolute bottom-2 left-0 right-0 text-center text-green-400 text-xs font-mono">SCANNING SKU...</div>
                    </div>
                    <p className="text-white text-sm animate-pulse">Align Product QR code within frame</p>
                </div>
            );
        };

        const ComplianceModal = ({ cart, farmer, onConfirm, onClose }) => {
            const [step, setStep] = useState(1);
            const [crop, setCrop] = useState('');
            const [processing, setProcessing] = useState(false);
            
            const hasFertilizer = cart.some(i => i.isDBT);
            const shcValid = farmer?.shcStatus === "Active";

            const runChecks = () => {
                setProcessing(true);
                setTimeout(() => { setProcessing(false); setStep(2); }, 1500);
            };

            return (
                <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm animate-slide-up">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg text-[#003366]">Scientific Compliance Check</h3>
                            <button onClick={onClose} className="text-gray-400">X</button>
                        </div>
                        {step === 1 && (
                            <div className="space-y-4">
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <h4 className="text-sm font-bold text-blue-900 mb-2">Analyzing Cart Compliance...</h4>
                                    <ul className="space-y-2">
                                        <li className="flex items-center gap-2 text-sm text-gray-700">
                                            <div className={`w-4 h-4 rounded-full flex items-center justify-center ${hasFertilizer ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'}`}>
                                                {hasFertilizer ? <AlertCircle size={10} /> : <CheckCircle size={10} />}
                                            </div>
                                            DBT Items: {hasFertilizer ? "Found (Urea/DAP)" : "None"}
                                        </li>
                                        <li className="flex items-center gap-2 text-sm text-gray-700">
                                            <div className="w-4 h-4 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><Fingerprint size={10} /></div>
                                            Auth: {hasFertilizer ? "Biometric Required" : "Standard"}
                                        </li>
                                    </ul>
                                </div>
                                <button onClick={runChecks} disabled={processing} className="w-full bg-[#003366] text-white py-3 rounded-xl font-bold flex justify-center gap-2">
                                    {processing ? "Connecting to SHC Server..." : "Run Advisory Check"}
                                </button>
                            </div>
                        )}
                        {step === 2 && (
                            <div className="space-y-4 animate-fade-in">
                                <div className={`p-4 rounded-xl border ${shcValid ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}>
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <p className={`text-xs font-bold uppercase ${shcValid ? 'text-green-700' : 'text-red-700'}`}>Soil Health Card</p>
                                            <p className="text-sm font-bold text-gray-800">{shcValid ? "Recommendations Matched" : "SHC Expired / Invalid"}</p>
                                        </div>
                                        {shcValid ? <CheckCircle className="text-green-600" /> : <AlertCircle className="text-red-600" />}
                                    </div>
                                    {shcValid && <p className="text-xs text-gray-500 mt-2">Purchase within N-P-K limits.</p>}
                                </div>
                                {hasFertilizer && (
                                    <div>
                                        <label className="text-xs font-bold text-gray-700 mb-1 block">Crop Intention (Geo-tagging)</label>
                                        <select value={crop} onChange={e => setCrop(e.target.value)} className="w-full border p-3 rounded-xl text-sm bg-white focus:ring-2 focus:ring-[#003366] outline-none">
                                            <option value="">Select Crop...</option>

                            message: `Advisory: ${item.name} is not recommended for your ${user.soilType} soil.`

                if (mode === 'sell') {
                    const maxYield = user.landArea * (item.maxYieldPerAcre || 0);
                    const currentQty = cart.find(i => i.id === item.id)?.qty || 0;
                    
                    if (currentQty + 1 > maxYield) {
                        setNotification({ 
                            type: 'error', 
                            message: `Compliance Block: Your land (${user.landArea} Acres) yield limit is ${Math.floor(maxYield)} Qtl for ${item.name}. Cannot sell more.`

                    </section>

                                <div className="animate-fade-in">
                                    <label className="text-xs font-bold text-gray-700 uppercase mb-2 block">Farmer ID <span className="text-gray-400 font-normal normal-case">OR</span> Aadhaar Number</label>
                                    <div className="relative mb-4"><div className="absolute left-3 top-3.5 text-gray-400"><User size={18} /></div><input type="text" value={farmerId} onChange={(e) => setFarmerId(e.target.value)} placeholder="Ex: AGRI-1234 or 1234 5678" className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#003366] outline-none text-sm transition-all" /></div>
                                    <button onClick={handleContinue} disabled={loading} className="w-full bg-[#003366] text-white py-3.5 rounded-xl font-bold text-lg shadow-lg hover:bg-blue-900 transition-colors flex items-center justify-center gap-2">{loading ? 'Verifying...' : <>Continue <ArrowRight size={20} /></>}</button>
                                </div>
                            ) : (
                                <div className="animate-slide-up">
                                    <div className="bg-blue-50 p-3 rounded-lg mb-4 border border-blue-100"><p className="text-xs text-blue-800 font-bold mb-1">OTP Sent to Mobile</p><p className="text-[10px] text-blue-600">Enter the 4-digit code sent to +91 ******3210</p></div>
                                    <div className="flex justify-center gap-3 mb-6">{[0, 1, 2, 3].map((_, i) => (<input key={i} type="text" maxLength="1" className="w-12 h-14 border border-gray-300 rounded-xl text-center text-2xl font-bold focus:border-[#003366] focus:ring-2 focus:ring-blue-100 outline-none" value={otp[i] || ''} onChange={(e) => { const val = e.target.value; if (val.length <= 1) { const newOtp = otp.split(''); newOtp[i] = val; setOtp(newOtp.join('')); if (val && i < 3) document.querySelectorAll('input[type="text"]')[i + 2]?.focus(); } }} />))}</div>
                                    <button onClick={handleVerify} disabled={otp.length < 4 || loading} className="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold text-lg shadow-lg shadow-green-200 hover:bg-green-700 transition-colors flex items-center justify-center gap-2">{loading ? 'Logging in...' : 'Verify & Login'}</button>
                                </div>
                            )}
                            {step === 0 && (
                                <><div className="relative flex items-center py-2"><div className="flex-grow border-t border-gray-200"></div><span className="flex-shrink-0 mx-4 text-gray-400 text-xs">OFFICIAL USE ONLY</span><div className="flex-grow border-t border-gray-200"></div></div><button onClick={() => onLogin('officer', null)} className="w-full bg-indigo-50 text-indigo-900 py-3.5 rounded-xl font-bold text-lg hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 border border-indigo-100"><ShieldCheck size={20} /> Officer Login</button></>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const App = () => {
            const [viewState, setViewState] = useState('login'); 
            const [activeTab, setActiveTab] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);
            const [isOfficerMode, setIsOfficerMode] = useState(false);

            useEffect(() => {
                if (currentUser && currentUser.history) { setTransactions(currentUser.history); } else { setTransactions([]); }
            }, [currentUser]);

            const handleLogin = (role, userData) => { if (role === 'farmer') { setCurrentUser(userData); setIsOfficerMode(false); setViewState('farmer_dash'); } else if (role === 'officer') { setViewState('officer_dash'); setIsOfficerMode(true); } };
            const handleLogout = () => { if (isOfficerMode && viewState === 'farmer_dash') { setViewState('officer_dash'); setCurrentUser(null); } else { setViewState('login'); setCurrentUser(null); setIsOfficerMode(false); } };
            const handleNavigateToPortal = (page) => { if(page === 'status') setViewState('portal_status'); else if(page === 'schemes') setViewState('portal_schemes'); else setViewState('portal_home'); };
            const handleBackFromPortal = () => { setViewState('farmer_dash'); };

            if (viewState === 'login') return <LoginView onLogin={handleLogin} />;
            if (viewState === 'portal_home') return <PortalDashboardView userProfile={currentUser} onBack={handleBackFromPortal} onNavigateToStatus={() => setViewState('portal_status')} onNavigateToSchemes={() => setViewState('portal_schemes')} />;
            if (viewState === 'portal_status') return <PortalStatusView userProfile={currentUser} onBack={handleBackFromPortal} />;
            if (viewState === 'portal_schemes') return <PortalSchemesView onBack={handleBackFromPortal} />;
            if (viewState === 'officer_dash') return <div className="flex justify-center min-h-screen"><div className="w-full max-w-md bg-gray-50 shadow-2xl relative min-h-screen flex flex-col"><Header officerMode={true} onLogout={handleLogout} /><OfficerDashboard onSelectFarmer={(farmer) => { setCurrentUser(farmer); setViewState('farmer_dash'); }} /></div></div>;

            return (
                <div className="flex justify-center min-h-screen">
                    <div className="w-full max-w-md bg-white shadow-2xl relative min-h-screen flex flex-col">
                        <Header officerMode={isOfficerMode} onLogout={handleLogout} />
                        <main className="flex-1">
                            {activeTab === 'dashboard' ? <DashboardView userProfile={currentUser} officerMode={isOfficerMode} onNavigateToPortal={handleNavigateToPortal} /> : 
                             activeTab === 'pos' ? <PoSView onTransactionComplete={(tx) => setTransactions([tx, ...transactions])} officerMode={isOfficerMode} user={currentUser} /> :
                             activeTab === 'market' ? <MarketView /> :
                             <ProfileView userProfile={currentUser} transactions={transactions} />
                            }
                        </main>
                        <Navigation activeTab={activeTab} setActiveTab={setActiveTab} />
                    </div>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
